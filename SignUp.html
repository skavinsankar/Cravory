<body>

    <!-- Navbar -->

    <div class="container-xxl position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 sticky-top" style="z-index: 1030;">

    <!-- Signup Form -->
    <div class="container py-5">
        <div class="signup-box mx-auto" style="max-width: 500px;">
            <p class="text-center mb-4 navbar-brand p-0" style="font-size: 40px; font-weight: 500;">
                <i class="fa fa-utensils me-2 text-warning"></i>Cravory Sign Up
            </p>
            <form method="POST" action="signup.php" id="signupForm" enctype="multipart/form-data">
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" name="first_name" required>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" name="last_name" required>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label for="email" class="form-label">Email ID</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label for="phone_number" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="profile_picture" class="form-label">Profile Picture</label>
                    <input type="file" class="form-control" id="profile_picture" name="profile_picture" accept="image/*">
                </div>
                
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-5 col-md-6">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            required>
                        <div id="passwordError" class="password-error">Passwords do not match!</div>
                    </div>
                </div>

                <div class="mb-3 text-center">
                    <button type="submit" class="btn btn-orange">Sign Up</button>
                </div>

                <p class="text-center mb-0">
                    Already have an account? <a href="login.html">Login Here</a>
                </p>
            </form>
        </div>
    </div>




    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

    <!-- Password Validation Script -->
    <script>
        const form = document.getElementById("signupForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        const errorMsg = document.getElementById("passwordError");

        function checkPasswordMatch() {
            if (confirmPassword.value.length > 0 && confirmPassword.value !== password.value) {
                errorMsg.style.display = "block";
                confirmPassword.classList.add("is-invalid");
                return false;
            } else {
                errorMsg.style.display = "none";
                confirmPassword.classList.remove("is-invalid");
                return true;
            }
        }

        password.addEventListener("input", checkPasswordMatch);
        confirmPassword.addEventListener("input", checkPasswordMatch);

        form.addEventListener("submit", function (e) {
            if (!checkPasswordMatch()) {
                e.preventDefault();
            }
        });
    </script>
